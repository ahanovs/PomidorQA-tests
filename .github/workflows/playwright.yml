# Имя workflow — так он отображается во вкладке Actions.
# ВАЖНО: на это имя подписан AI-ревьюер (.github/workflows/ai-review.yml через
# workflow_run), поэтому переименовывать workflow нельзя.
name: Playwright CI

# События, которые запускают проверки.
on:
  push:
    branches: [main]
  # Проверяем каждое изменение до слияния через Pull Request.
  pull_request:
    # `main` здесь — целевая ветка PR, а не имя рабочей ветки.
    branches: [main]
  # Оставляем кнопку ручного запуска во вкладке Actions.
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет ещё не закончившийся старый прогон:
# результат устаревшего коммита никому не нужен, а минуты runner'а экономятся.
concurrency:
  group: playwright-ci-${{ github.ref }}
  cancel-in-progress: true

# Все работы, которые выполнит workflow.
# Pipeline собран по принципу «от дешёвого к дорогому»: статика и быстрые тесты
# идут первыми, а самый дорогой E2E против живого стенда стартует только после
# их зелёного результата.
jobs:
  # 1. Quality — статический анализ кода: линтер и проверка типов.
  # Браузер здесь не нужен, поэтому джоба собирается быстрее остальных.
  quality:
    name: Quality (ESLint + TypeScript)
    # Статика не должна висеть: 10 минут с запасом.
    timeout-minutes: 10
    # Запускаем на чистой Linux-машине GitHub.
    runs-on: ubuntu-latest

    steps:
      # Загружаем в runner код текущего PR или ветки.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Готовим версию Node.js, на которой работает проект.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node.js 24 поддерживается текущими версиями ESLint и Playwright.
          node-version: 24
          # Кэшируем скачанные npm-пакеты, но не готовый `node_modules`.
          cache: npm

      # `npm ci` ставит точные версии из lock-файла и проверяет его согласованность с package.json.
      - name: Install npm dependencies
        run: npm ci

      # Тот же npm-скрипт, который разработчик запускает локально перед пушем.
      - name: Lint tests
        run: npm run lint

      # `tsc --noEmit` проверяет типы во всём проекте и ничего не собирает на диск.
      - name: Typecheck
        run: npm run typecheck

  # 2. Unit — чистая логика без браузера и без сети.
  unit:
    name: Unit tests
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Playwright-проект `unit` исполняет чистый TypeScript — бинарник браузера не нужен.
      - name: Run unit tests
        run: npm run test:unit
        env:
          # Включает CI-режим в playwright.config.ts: retry и reporter без открытия окна.
          CI: true

      # JSON и JUnit уходят в артефакты: JSON скармливается metrics.mjs в Summary,
      # JUnit — универсальный формат для внешних систем отчётности.
      - name: Upload JSON and JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-json-report-${{ github.run_id }}
          path: |
            test-results/report.json
            test-results/junit.xml
          retention-days: 14

  # 3. API — HTTP-тесты против локального мок-сервера; браузер не нужен.
  api:
    name: API tests
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Мок-сервер стартует внутри самого спека (beforeAll), отдельных шагов не требуется.
      - name: Run API tests
        run: npm run test:api
        env:
          CI: true

      - name: Upload JSON and JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-json-report-${{ github.run_id }}
          path: |
            test-results/report.json
            test-results/junit.xml
          retention-days: 14

  # 4. E2E — самая дорогая проверка: живой общий стенд aiqa.su и браузер.
  # Гейт `needs` не даст ей стартовать, если статика или быстрые тесты упали.
  e2e:
    name: E2E (Chromium)
    needs: [quality, unit, api]
    # Останавливаем зависший прогон через 30 минут.
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Кэшируем бинарники браузеров между запусками: Chromium весит больше сотни мегабайт.
      # Ключ привязан к lock-файлу — обновили Playwright, кэш пересоберётся.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `--with-deps` добавляет нужные Chromium'у системные библиотеки Linux.
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # CI-режим: один worker и retry — общий стенд не любит параллельных пользователей.
          CI: true

      - name: Upload JSON and JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-json-report-${{ github.run_id }}
          path: |
            test-results/report.json
            test-results/junit.xml
          retention-days: 14

      # Сохраняем HTML-отчёт после завершения тестов — и после успеха, и после падения.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Уникальный run_id не даёт отчётам разных запусков конфликтовать по имени.
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          # Двух недель достаточно для разбора PR, старые учебные отчёты не храним бессрочно.
          retention-days: 14

      # Трейсы, скриншоты и видео падений: конфиг уже создаёт их в test-results/,
      # здесь мы наконец забираем их из runner'а для разбора без локального повтора.
      - name: Upload traces, screenshots and videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          # На полностью зелёном прогоне каталог пуст — это не ошибка загрузки.
          if-no-files-found: ignore

  # 5. Summary & Notify — итоговая страница запуска и Telegram-уведомление.
  # Собирает статусы всех проверок, даже когда что-то упало или не стартовало.
  summary:
    name: Summary & Notify
    needs: [quality, unit, api, e2e]
    # `always()` — джоба получает слово и после падения, и после отмены соседей.
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest

    # Токен по умолчанию может не иметь прав на actions API — выдаём явно:
    # contents нужен для checkout, actions — за run_duration_ms для Telegram.
    permissions:
      contents: read
      actions: read

    env:
      # Секреты пробрасываются на уровне job, чтобы шаг мог проверить их наличие
      # и тихо пропуститься, пока Telegram-бот не подключен.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      # metrics.mjs — файл репозитория: без checkout шагу метрик нечего запускать.
      - name: Checkout repository
        uses: actions/checkout@v6

      # JSON-отчёты трёх джоб собираем в отдельные папки; если джоба не доехала,
      # продолжаем с пометкой — metrics.mjs умеет жить без части отчётов.
      - name: Download unit JSON report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: unit-json-report-${{ github.run_id }}
          path: metrics/unit

      - name: Download API JSON report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: api-json-report-${{ github.run_id }}
          path: metrics/api

      - name: Download E2E JSON report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: e2e-json-report-${{ github.run_id }}
          path: metrics/e2e

      - name: Append run metrics to summary
        if: ${{ always() }}
        run: |
          node scripts/metrics.mjs \
            metrics/unit/report.json \
            metrics/api/report.json \
            metrics/e2e/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Write job summary
        # Всё, что скрипт напишет в $GITHUB_STEP_SUMMARY, GitHub покажет
        # на вкладке Summary у этого запуска.
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          status_emoji() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped)   echo "⏭" ;;
              *)         echo "❔" ;;
            esac
          }

          {
            echo "## 🍅 PomidorQA CI Summary"
            echo ""
            echo "| Проверка | Статус |"
            echo "| --- | --- |"
            echo "| Quality (ESLint + TypeScript) | $(status_emoji '${{ needs.quality.result }}') \`${{ needs.quality.result }}\` |"
            echo "| Unit tests | $(status_emoji '${{ needs.unit.result }}') \`${{ needs.unit.result }}\` |"
            echo "| API tests | $(status_emoji '${{ needs.api.result }}') \`${{ needs.api.result }}\` |"
            echo "| E2E (Chromium) | $(status_emoji '${{ needs.e2e.result }}') \`${{ needs.e2e.result }}\` |"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| 🌿 Ветка | \`${{ github.ref_name }}\` |"
            echo "| 📦 Коммит | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| 👤 Автор | ${{ github.actor }} |"
            echo "| ⚡ Событие | \`${{ github.event_name }}\` |"
            echo ""
            echo "▶️ [Полный лог запуска]($run_url)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram notification
        # Пока секреты не заданы, шаг просто пропускается — CI от этого не краснеет.
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          status_emoji() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped)   echo "⏭" ;;
              *)         echo "❔" ;;
            esac
          }

          # Общее время прогона — из GitHub API: от старта первой джобы до текущего шага.
          # Если API недоступен, строка просто не попадёт в сообщение.
          duration_line=""
          run_ms="$(curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | jq -r '.run_duration_ms // empty' || true)"
          if [ -n "$run_ms" ] && [ "$run_ms" -gt 0 ] 2>/dev/null; then
            duration_line="⏱ Прогон: $(( run_ms / 60000 )) мин $(( (run_ms % 60000) / 1000 )) с"
          fi

          text="🍅 PomidorQA CI — $( [ '${{ needs.quality.result }}' = 'success' ] && [ '${{ needs.unit.result }}' = 'success' ] && [ '${{ needs.api.result }}' = 'success' ] && [ '${{ needs.e2e.result }}' = 'success' ] && echo 'всё зелёное ✅' || echo 'есть проблемы ❌' )
          🌿 Ветка: ${{ github.ref_name }}
          📦 Коммит: ${GITHUB_SHA::7}
          👤 Автор: ${{ github.actor }}
          ${duration_line}

          $(status_emoji '${{ needs.quality.result }}') Quality (ESLint + TypeScript)
          $(status_emoji '${{ needs.unit.result }}') Unit tests
          $(status_emoji '${{ needs.api.result }}') API tests
          $(status_emoji '${{ needs.e2e.result }}') E2E (Chromium)"

          # jq собирает корректный JSON: значения подставляются как экранированные строки.
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$text" \
            --arg url "$run_url" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true,
              reply_markup: {inline_keyboard: [[{text: "Открыть запуск", url: $url}]]}}')"

          # `-f` превращает HTTP-ошибку Telegram в падение шага.
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$payload"
